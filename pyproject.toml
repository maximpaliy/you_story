[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "you-story"
version = "0.1.0"
description = "You Story modular monolith foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.161.0",
  "uvicorn==0.54.0",
  "sqlalchemy==2.1.6",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.16.1",
  "pglast==8.7",
  "cryptography==46.0.3",
  "pyjwt==2.10.1",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "anyio==4.15.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.17.2",
    "mypy==2.4.0",
    "playwright==1.56.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
you_story = ["**/*.sql", "**/*.json", "**/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = ["postgres: requires disposable PostgreSQL", "browser: real HTTPS Chromium journey"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pglast.*"]
ignore_missing_imports = true
