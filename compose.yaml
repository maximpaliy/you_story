# Disposable development/test fixture; never use these credentials outside localhost.
services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_PASSWORD: local-fixture-only
      POSTGRES_DB: you_story_issue9_test
    ports:
      - '127.0.0.1:55439:5432'
    volumes:
      - foundation-db:/var/lib/postgresql/data
      - ./tools/db-bootstrap.sql:/docker-entrypoint-initdb.d/001-fixture.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d you_story_issue9_test']
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  foundation-db:
