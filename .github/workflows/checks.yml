name: Foundation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_PASSWORD: local-fixture-only
          POSTGRES_DB: you_story_issue9_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d you_story_issue9_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/work/uv-cache
      TEST_ADMIN_URL: postgresql://postgres:local-fixture-only@127.0.0.1:5432/you_story_issue9_test
      TEST_DATABASE_CONFIRM: disposable
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/work/browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - run: python -m pip install uv==0.12.19
      - name: Bootstrap disposable roles and database marker
        env:
          PGPASSWORD: local-fixture-only
        run: psql -h 127.0.0.1 -U postgres -d you_story_issue9_test -v ON_ERROR_STOP=1 -f tools/db-bootstrap.sql
      - run: make sync
      - name: Install lockfile-pinned Chromium for HTTPS security journeys
        run: uv run --frozen python -m playwright install --with-deps chromium
      - run: make check
