notes:
  - Initial project bootstrap.
  - "Issue #1 requirements and owner clarifications are synchronized to the product definition."
  - Proposed architecture passed independent architecture review; security review is conditional with open findings.
  - Modular-monolith architecture and the independently reviewed ADR-005 module/data boundaries are approved; the boundary condition is complete.
  - ADR-002 extensible catalog/history and ADR-003 tenancy/future-sharing and authorization/RLS decisions are approved.
  - ADR-004 managed GCP foundation and private-media boundary are approved, with production and media-policy gates retained.
  - ADR-006 is approved; media, account deletion and offline capabilities are excluded from the first increment, and ordinary later additive migrations are allowed.
  - ADR-007 Google OIDC and server-side web-session architecture is approved; email is not collected in the first increment.
  - First-increment architecture is approved; privacy, media and production decisions remain later feature/deployment gates.
  - No security risk or production cost has been accepted.
  - No production implementation is authorized by the foundation workflow.
  - The first-increment test strategy passed independent review and was approved by the human owner on 2026-09-30 in Issue #4.
  - Issue #5 proposed ADR-008 for fail-closed PostgreSQL tenant isolation; the human owner directed the simpler two-identity model (`app_runtime` plus controlled `app_owner`) on 2026-10-02, and independent architecture/security/test-design re-reviews passed.
  - On 2026-10-03 the owner required explicit actor-derived tenant predicates in normal repository queries in addition to FORCE RLS; architecture, security and test-design re-reviews passed after the traceability and mutation design was expanded.
  - Post-bootstrap catalog provisioning was clarified on 2026-10-03: it runs only from first or pending-account login callbacks, never every HTTP request; atomicity, state-transition and concurrency reviews passed.
  - The human owner approved ADR-008 on 2026-10-03, completing Issue #5 and the SEC-01 design gate; implementation evidence and security re-review remain assigned to Issue #9.
